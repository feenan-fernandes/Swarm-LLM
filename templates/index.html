<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarm IDE — Autonomous Multi-Agent Engineering</title>
    <!-- Tailwind CSS -->
    <script src="/static/js/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#090d16', 900: '#0f172a', 850: '#141e33', 800: '#1e293b', 700: '#334155', 600: '#475569', 400: '#94a3b8', 300: '#cbd5e1' },
                        gray: { 900: '#0d1117', 850: '#121820', 800: '#161b22', 700: '#21262d', 600: '#30363d', 400: '#8b949e', 300: '#c9d1d9' },
                        blue: { 500: '#38bdf8', 600: '#0284c7' },
                        purple: { 500: '#c084fc', 600: '#9333ea' }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="/static/js/react.development.js"></script>
    <script src="/static/js/react-dom.development.js"></script>
    <!-- Babel for in-browser JSX -->
    <script src="/static/js/babel.min.js"></script>
    <!-- Marked.js -->
    <script src="/static/js/marked.min.js"></script>
    <style>
        body { background-color: #090d16; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
        .markdown p { margin-bottom: 0.75rem; }
        .markdown pre { background: #0d131f; padding: 1rem; border-radius: 0.75rem; border: 1px solid rgba(255,255,255,0.08); margin: 0.75rem 0; overflow-x: auto; }
        .markdown code { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 0.85em; }
        .markdown pre code { font-size: 0.85rem; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .loader { border: 2px solid #334155; border-top: 2px solid #38bdf8; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .transition-spring { transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        {% raw %}
        const { useState, useEffect, useRef } = React;

        const UnifiedDiffViewer = ({ diffText, title }) => {
            const lines = (diffText || '').split('\n');
            return (
                <div className="border border-slate-700/80 bg-slate-950 rounded-xl overflow-hidden font-mono text-[11px] my-1.5 shadow-md">
                    {title && (
                        <div className="px-3.5 py-1.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-slate-400">
                            <span className="font-bold text-slate-200 flex items-center gap-1.5">
                                <span className="text-sky-400">📝</span> {title}
                            </span>
                            <span className="text-[10px] uppercase tracking-wider text-slate-500 font-sans">Unified Diff</span>
                        </div>
                    )}
                    <div className="overflow-x-auto max-h-64 p-2 leading-tight">
                        {lines.map((line, lIdx) => {
                            let lineClass = "text-slate-300 py-0.5 px-2";
                            if (line.startsWith('+') && !line.startsWith('+++')) {
                                lineClass = "bg-emerald-950/50 text-emerald-300 border-l-2 border-emerald-500 py-0.5 px-2";
                            } else if (line.startsWith('-') && !line.startsWith('---')) {
                                lineClass = "bg-rose-950/50 text-rose-300 border-l-2 border-rose-500 py-0.5 px-2";
                            } else if (line.startsWith('@@')) {
                                lineClass = "bg-cyan-950/40 text-cyan-300 font-bold py-0.5 px-2 border-y border-cyan-800/30";
                            }
                            return (
                                <div key={lIdx} className={`flex items-start gap-2 ${lineClass} select-text`}>
                                    <span className="text-[10px] text-slate-600 select-none w-6 text-right tabular-nums">{lIdx + 1}</span>
                                    <span className="whitespace-pre-wrap break-all flex-1">{line}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const RichMessage = ({ content }) => {
            let working = content;

            // 1. Extract Thoughts
            const thinkRegex = /<think>([\s\S]*?)<\/think>/g;
            let thoughts = [];
            let match;
            while ((match = thinkRegex.exec(working)) !== null) {
                thoughts.push(match[1].trim());
            }
            working = working.replace(thinkRegex, '');

            // 2. Extract Ask User Questions
            const askUserRegex = /<ask_user>([\s\S]*?)<\/ask_user>/g;
            let userQuestions = [];
            while ((match = askUserRegex.exec(working)) !== null) {
                const qMatch = /<question>([\s\S]*?)<\/question>/i.exec(match[1]);
                userQuestions.push(qMatch ? qMatch[1].trim() : match[1].trim());
            }
            working = working.replace(askUserRegex, '');

            // 3. Extract Orchestration Plans
            const planRegex = /<plan>([\s\S]*?)<\/plan>/g;
            let plans = [];
            while ((match = planRegex.exec(working)) !== null) {
                const block = match[1];
                const goalM = /<goal>([\s\S]*?)<\/goal>/i.exec(block);
                const stepsM = /<steps>([\s\S]*?)<\/steps>/i.exec(block);
                const criteriaM = /<acceptance_criteria>([\s\S]*?)<\/acceptance_criteria>/i.exec(block);
                plans.push({
                    goal: goalM ? goalM[1].trim() : '',
                    steps: stepsM ? stepsM[1].trim() : '',
                    criteria: criteriaM ? criteriaM[1].trim() : ''
                });
            }
            working = working.replace(planRegex, '');

            // 4. Extract Spawned Workers
            const workerRegex = /<spawn_worker>([\s\S]*?)<\/spawn_worker>/g;
            let workers = [];
            while ((match = workerRegex.exec(working)) !== null) {
                const block = match[1];
                const taskMatch = /<task>([\s\S]*?)<\/task>/i.exec(block);
                const skillMatch = /<skill>([\s\S]*?)<\/skill>/i.exec(block);
                const roleMatch = /<role>([\s\S]*?)<\/role>/i.exec(block);
                
                workers.push({
                    task: taskMatch ? taskMatch[1].trim() : block.replace(/<[^>]+>/g, '').trim(),
                    skill: skillMatch ? skillMatch[1].trim() : '',
                    role: roleMatch ? roleMatch[1].trim() : 'Specialized Sub-Agent'
                });
            }
            working = working.replace(workerRegex, '');

            // 5. Extract Selected Skills
            const selectSkillRegex = /<select_skill>([\s\S]*?)<\/select_skill>/g;
            let selectedSkills = [];
            while ((match = selectSkillRegex.exec(working)) !== null) {
                const block = match[1];
                const nameM = /<skill_name>([\s\S]*?)<\/skill_name>/i.exec(block);
                const reasonM = /<reason>([\s\S]*?)<\/reason>/i.exec(block);
                selectedSkills.push({
                    name: nameM ? nameM[1].trim() : block.trim(),
                    reason: reasonM ? reasonM[1].trim() : ''
                });
            }
            working = working.replace(selectSkillRegex, '');

            // 6. Extract Python Tool Use
            const useSkillRegex = /<use_skill>([\s\S]*?)<\/use_skill>/g;
            let usedSkills = [];
            while ((match = useSkillRegex.exec(working)) !== null) {
                const block = match[1];
                const nameM = /<name>([\s\S]*?)<\/name>/i.exec(block);
                const argsM = /<args>([\s\S]*?)<\/args>/i.exec(block);
                usedSkills.push({
                    name: nameM ? nameM[1].trim() : 'tool',
                    args: argsM ? argsM[1].trim() : ''
                });
            }
            working = working.replace(useSkillRegex, '');

            // 7. Extract MCP Calls
            const mcpRegex = /<mcp_call>([\s\S]*?)<\/mcp_call>/g;
            let mcpCalls = [];
            while ((match = mcpRegex.exec(working)) !== null) {
                const block = match[1];
                const serverM = /<server>([\s\S]*?)<\/server>/i.exec(block);
                const toolM = /<tool>([\s\S]*?)<\/tool>/i.exec(block);
                const argsM = /<(?:arguments|args)>([\s\S]*?)<\/(?:arguments|args)>/i.exec(block);
                mcpCalls.push({
                    server: serverM ? serverM[1].trim() : 'server',
                    tool: toolM ? toolM[1].trim() : 'tool',
                    args: argsM ? argsM[1].trim() : ''
                });
            }
            working = working.replace(mcpRegex, '');

            // 8. Extract Hyperframes Video
            const hyperRegex = /<render_hyperframes_video>([\s\S]*?)<\/render_hyperframes_video>/g;
            let hyperframes = [];
            while ((match = hyperRegex.exec(working)) !== null) {
                const block = match[1];
                const outM = /<output_filename>([\s\S]*?)<\/output_filename>/i.exec(block);
                hyperframes.push({
                    filename: outM ? outM[1].trim() : 'launch_trailer.mp4'
                });
            }
            working = working.replace(hyperRegex, '');

            // 9. Extract Mission Completion / Finish
            const finishRegex = /<finish(?:\s+status="([^"]*)")?>([\s\S]*?)<\/finish>/g;
            let finishes = [];
            while ((match = finishRegex.exec(working)) !== null) {
                const status = match[1] || 'success';
                const block = match[2];
                const sumM = /<summary>([\s\S]*?)<\/summary>/i.exec(block);
                finishes.push({
                    status: status,
                    summary: sumM ? sumM[1].trim() : block.trim()
                });
            }
            working = working.replace(finishRegex, '');

            // 10. Extract Swarm Action Observations (Modern & Legacy)
            const actionRegex = /<swarm_action\s+action="([^"]*)">([\s\S]*?)<\/swarm_action>/g;
            let actions = [];
            while ((match = actionRegex.exec(working)) !== null) {
                actions.push({ action: match[1], result: match[2].trim() });
            }
            working = working.replace(actionRegex, '');

            const legacyActionRegex = /> \*\*\[OVERLORD\]\*\* ([^\n:]+):[ \t]*\n>[ \t]*```[a-zA-Z]*\n([\s\S]*?)\n>[ \t]*```/g;
            while ((match = legacyActionRegex.exec(working)) !== null) {
                actions.push({ action: match[1].trim(), result: match[2].trim() });
            }
            working = working.replace(legacyActionRegex, '');

            // 11. Extract Hermes Native Tool Calls
            const toolCallRegex = /<tool_call>([\s\S]*?)<\/tool_call>/g;
            let nousToolCalls = [];
            while ((match = toolCallRegex.exec(working)) !== null) {
                let raw = match[1].trim();
                let clean = raw;
                if (clean.startsWith('```')) {
                    clean = clean.replace(/^```[a-zA-Z]*\n/, '').replace(/\n```$/, '').trim();
                }
                try {
                    const parsed = JSON.parse(clean);
                    nousToolCalls.push({
                        name: parsed.name || parsed.tool || 'tool_call',
                        args: JSON.stringify(parsed.arguments || parsed.parameters || parsed.args || {}, null, 2)
                    });
                } catch(e) {
                    nousToolCalls.push({ name: 'tool_call', args: raw });
                }
            }
            working = working.replace(toolCallRegex, '');

            // 12. Extract Persistent Memory Updates
            const memRegex = /<update_memory(?:\s+target="([^"]*)")?>([\s\S]*?)<\/update_memory>/g;
            let memUpdates = [];
            while ((match = memRegex.exec(working)) !== null) {
                memUpdates.push({
                    target: match[1] || 'project',
                    content: match[2].trim()
                });
            }
            working = working.replace(memRegex, '');

            // 13. Extract Skill Creation Calls
            const createSkillRegex = /<create_skill(?:\s+name="([^"]*)")?(?:\s+slug="([^"]*)")?(?:\s+category="([^"]*)")?>([\s\S]*?)<\/create_skill>/g;
            let createdSkills = [];
            while ((match = createSkillRegex.exec(working)) !== null) {
                createdSkills.push({
                    name: match[1] || 'Dynamic Skill',
                    slug: match[2] || 'dynamic-skill',
                    category: match[3] || 'tool',
                    body: match[4].trim()
                });
            }
            working = working.replace(createSkillRegex, '');

            // 14. Extract Standard Tools
            const toolRegex = /<(execute_bash|write_file|patch_file|replace_block|search_rag|run_test)[\s\S]*?>([\s\S]*?)<\/\1>/g;
            let tools = [];
            while ((match = toolRegex.exec(working)) !== null) {
                tools.push({ type: match[1], body: match[2].trim() });
            }
            working = working.replace(toolRegex, '');

            return (
                <div className="flex flex-col gap-3">
                    {/* Chain of Thought */}
                    {thoughts.map((t, idx) => (
                        <details key={idx} className="group border border-slate-700/60 rounded-xl bg-slate-900/60 overflow-hidden cursor-pointer shadow-sm">
                            <summary className="px-3.5 py-2 text-xs font-semibold text-slate-400 select-none hover:text-slate-200 flex items-center justify-between transition">
                                <span className="flex items-center gap-2">
                                    <span className="text-sky-400 text-sm">💭</span> Agent Reasoning (Chain of Thought)
                                </span>
                                <span className="text-[10px] text-slate-500 group-open:rotate-180 transition-transform">▼</span>
                            </summary>
                            <div className="px-3.5 py-2.5 text-xs text-slate-300 border-t border-slate-700/60 cursor-text whitespace-pre-wrap bg-slate-950/60 leading-relaxed font-mono">
                                {t}
                            </div>
                        </details>
                    ))}

                    {/* Ask User Clarification Callout */}
                    {userQuestions.map((q, idx) => (
                        <div key={`q-${idx}`} className="border-2 border-amber-500/70 bg-amber-950/40 rounded-xl p-4 flex flex-col gap-2.5 shadow-lg backdrop-blur-sm">
                            <div className="flex items-center gap-2 text-amber-300 text-xs font-bold uppercase tracking-wider">
                                <span className="text-base">❓</span> Clarification Needed From You
                            </div>
                            <p className="text-sm text-amber-100 font-medium leading-relaxed">{q}</p>
                            <div className="text-[11px] text-amber-400/80 font-mono">
                                Type your answer in the prompt box below to guide the swarm.
                            </div>
                        </div>
                    ))}

                    {/* Orchestration Plan Card */}
                    {plans.map((p, idx) => (
                        <div key={`plan-${idx}`} className="border border-sky-500/40 bg-sky-950/20 rounded-xl p-4 flex flex-col gap-3 shadow-md">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2 text-xs font-bold text-sky-400 uppercase tracking-wider">
                                    <span>📋</span> Orchestration Plan
                                </div>
                                <span className="text-[10px] text-sky-300 font-mono px-2 py-0.5 rounded bg-sky-900/60 border border-sky-700/50">Active Strategy</span>
                            </div>
                            {p.goal && (
                                <div>
                                    <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-0.5">Goal</span>
                                    <p className="text-xs text-slate-200 leading-relaxed font-medium">{p.goal}</p>
                                </div>
                            )}
                            {p.steps && (
                                <div>
                                    <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-0.5">Execution Steps</span>
                                    <div className="text-xs text-slate-300 whitespace-pre-wrap leading-relaxed font-mono bg-black/40 p-2.5 rounded-lg border border-slate-800">{p.steps}</div>
                                </div>
                            )}
                            {p.criteria && (
                                <div>
                                    <span className="text-[11px] font-semibold text-emerald-400 uppercase tracking-wider block mb-0.5">Acceptance Criteria</span>
                                    <div className="text-xs text-emerald-300/90 leading-relaxed font-mono bg-emerald-950/30 p-2 rounded-lg border border-emerald-500/30">{p.criteria}</div>
                                </div>
                            )}
                        </div>
                    ))}

                    {/* Skill Injected Badges */}
                    {selectedSkills.map((sk, idx) => (
                        <div key={idx} className="border border-purple-500/30 bg-purple-950/30 rounded-xl p-3 flex items-start gap-3 shadow-sm backdrop-blur-sm">
                            <span className="text-purple-400 text-base mt-0.5">⚡</span>
                            <div className="flex flex-col">
                                <div className="text-xs font-bold text-purple-200 flex items-center gap-2">
                                    <span>Framework Activated:</span>
                                    <span className="px-2.5 py-0.5 rounded-lg bg-purple-500/20 text-purple-100 border border-purple-500/40 font-mono text-[11px]">{sk.name}</span>
                                </div>
                                {sk.reason && <p className="text-xs text-slate-400 mt-1 leading-relaxed">{sk.reason}</p>}
                            </div>
                        </div>
                    ))}

                    {/* Python Tool Execution Cards */}
                    {usedSkills.map((us, idx) => (
                        <div key={idx} className="border border-emerald-500/30 bg-emerald-950/30 rounded-xl p-3.5 flex flex-col gap-2 shadow-sm backdrop-blur-sm">
                            <div className="flex items-center justify-between text-xs font-bold text-emerald-400">
                                <div className="flex items-center gap-2">
                                    <span>⚙️</span> Executing Tool: <span className="font-mono text-emerald-200">{us.name}</span>
                                </div>
                                <span className="text-[10px] uppercase tracking-wider text-emerald-400/80 font-mono">workspace/skills</span>
                            </div>
                            {us.args && (
                                <pre className="text-xs text-slate-200 font-mono bg-black/50 p-2.5 rounded-lg border border-emerald-500/20 overflow-x-auto">
                                    python {us.name} {us.args}
                                </pre>
                            )}
                        </div>
                    ))}

                    {/* MCP Tool Execution Cards */}
                    {mcpCalls.map((mcp, idx) => (
                        <div key={`mcp-${idx}`} className="border border-indigo-500/40 bg-indigo-950/20 rounded-xl p-3.5 flex flex-col gap-2 shadow-sm">
                            <div className="flex items-center justify-between text-xs font-bold text-indigo-300">
                                <div className="flex items-center gap-2">
                                    <span>🔌</span> MCP Bridge Call: <span className="font-mono text-white">{mcp.server}/{mcp.tool}</span>
                                </div>
                                <span className="text-[10px] text-indigo-400 font-mono">MCP Protocol</span>
                            </div>
                            {mcp.args && (
                                <pre className="text-xs text-slate-300 font-mono bg-black/40 p-2.5 rounded-lg border border-indigo-500/20 overflow-x-auto">
                                    {mcp.args}
                                </pre>
                            )}
                        </div>
                    ))}

                    {/* Spawned Swarm Workers */}
                    {workers.length > 0 && (
                        <div className="flex flex-col gap-2.5">
                            <div className="text-xs font-bold text-sky-400 uppercase tracking-wider flex items-center gap-2">
                                <span>🤖</span> Swarm Workers Deployed ({workers.length})
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {workers.map((w, idx) => (
                                    <div key={idx} className="border border-sky-500/30 bg-slate-850 rounded-xl p-3.5 flex flex-col justify-between shadow-sm hover:border-sky-500/60 transition">
                                        <div>
                                            <div className="flex items-center justify-between gap-2 mb-2">
                                                <span className="text-xs font-bold text-white bg-sky-600/30 border border-sky-500/40 px-2.5 py-0.5 rounded-md">
                                                    {w.role}
                                                </span>
                                                {w.skill && (
                                                    <span className="text-[10px] font-mono text-purple-300 bg-purple-950/50 border border-purple-500/30 px-2 py-0.5 rounded-md truncate max-w-[150px]" title={w.skill}>
                                                        ⚡ {w.skill}
                                                    </span>
                                                )}
                                            </div>
                                            <p className="text-xs text-slate-300 leading-relaxed line-clamp-3">{w.task}</p>
                                        </div>
                                        <div className="mt-3 pt-2.5 border-t border-slate-700/50 flex items-center justify-between text-[10px] text-slate-400">
                                            <span>Sub-Agent #{idx + 1}</span>
                                            <span className="flex items-center gap-1.5 text-emerald-400 font-medium">
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Parallel Running
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Swarm Action Observation Cards */}
                    {actions.map((act, idx) => {
                        if (act.action === 'verification_gate_rejection') {
                            return (
                                <div key={`act-${idx}`} className="border-2 border-rose-500/70 bg-rose-950/30 rounded-xl p-4 flex flex-col gap-2.5 shadow-lg backdrop-blur-sm">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-2 text-rose-300 text-xs font-bold uppercase tracking-wider">
                                            <span className="text-base">🛡️</span> Deterministic Verification Gate Rejection
                                        </div>
                                        <span className="text-[10px] font-mono px-2 py-0.5 rounded uppercase font-semibold bg-rose-500/20 text-rose-200 border border-rose-500/40">
                                            Iron Law Active
                                        </span>
                                    </div>
                                    <div className="text-xs text-rose-100 whitespace-pre-wrap leading-relaxed font-mono bg-black/50 p-3 rounded-lg border border-rose-500/30">
                                        {act.result}
                                    </div>
                                </div>
                            );
                        }
                        return (
                            <details key={`act-${idx}`} className="group border border-slate-700/60 bg-slate-900/60 rounded-xl overflow-hidden shadow-sm">
                                <summary className="px-3.5 py-2.5 text-xs font-semibold text-slate-300 hover:text-white flex items-center justify-between cursor-pointer select-none bg-slate-850/80 transition">
                                    <div className="flex items-center gap-2">
                                        <span className="text-emerald-400">⚡</span>
                                        <span className="text-slate-400 font-normal">Swarm Action Observation:</span>
                                        <span className="font-mono text-white px-2 py-0.5 rounded bg-slate-700 text-[11px] font-bold">{act.action}</span>
                                    </div>
                                    <span className="text-[10px] text-slate-500 group-open:rotate-180 transition-transform">▼</span>
                                </summary>
                                <div className="p-3 bg-black/40 border-t border-slate-700/50 text-xs font-mono text-slate-300 whitespace-pre-wrap max-h-60 overflow-y-auto leading-relaxed">
                                    {act.result}
                                </div>
                            </details>
                        );
                    })}

                    {/* Mission Completion Banner */}
                    {finishes.map((fn, idx) => (
                        <div key={`fin-${idx}`} className={`border rounded-xl p-4 flex flex-col gap-2 shadow-md ${fn.status === 'success' ? 'border-emerald-500/40 bg-emerald-950/25' : 'border-amber-500/40 bg-amber-950/25'}`}>
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-emerald-400">
                                    <span>🏁</span> Mission Accomplished
                                </div>
                                <span className={`text-[10px] font-mono px-2 py-0.5 rounded uppercase font-semibold ${fn.status === 'success' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'}`}>
                                    {fn.status}
                                </span>
                            </div>
                            {fn.summary && (
                                <div className="markdown text-xs text-slate-200 leading-relaxed font-sans mt-1" dangerouslySetInnerHTML={{ __html: marked.parse(fn.summary) }} />
                            )}
                        </div>
                    ))}

                    {/* Hyperframes Cinematic Video Card */}
                    {hyperframes.map((hf, idx) => (
                        <div key={idx} className="border border-amber-500/40 bg-amber-950/20 rounded-xl p-3.5 flex items-center justify-between shadow-sm">
                            <div className="flex items-center gap-2.5">
                                <span className="text-xl">🎬</span>
                                <div>
                                    <div className="text-xs font-bold text-amber-300">Rendering Video via Hyperframes</div>
                                    <div className="text-[11px] text-slate-400 font-mono">workspace/{hf.filename}</div>
                                </div>
                            </div>
                            <span className="text-xs bg-amber-500/20 text-amber-200 border border-amber-500/40 px-2.5 py-1 rounded-lg font-semibold">GSAP 4K</span>
                        </div>
                    ))}

                    {/* Markdown Body */}
                    {working.trim() && (
                        <div className="markdown text-sm text-slate-200 leading-relaxed select-text" dangerouslySetInnerHTML={{ __html: marked.parse(working) }} />
                    )}

                    {/* Persistent Memory Update Cards */}
                    {memUpdates.map((m, idx) => (
                        <div key={`mem-${idx}`} className="border border-emerald-500/40 bg-emerald-950/20 rounded-xl p-3.5 flex flex-col gap-2 shadow-sm">
                            <div className="flex items-center justify-between text-xs font-bold text-emerald-300">
                                <div className="flex items-center gap-2">
                                    <span>🧠</span> Persistent Memory Updated ({m.target.toUpperCase()})
                                </div>
                                <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-emerald-500/20 border border-emerald-500/30 text-emerald-300">
                                    workspace/memory/{m.target === 'user' ? 'USER.md' : 'MEMORY.md'}
                                </span>
                            </div>
                            <div className="text-xs text-emerald-100 whitespace-pre-wrap font-mono bg-black/40 p-2.5 rounded-lg border border-emerald-500/20">
                                {m.content}
                            </div>
                        </div>
                    ))}

                    {/* Hermes Native Tool Call Cards */}
                    {nousToolCalls.map((tc, idx) => (
                        <div key={`tc-${idx}`} className="border border-amber-500/40 bg-amber-950/20 rounded-xl p-3.5 flex flex-col gap-2 shadow-sm">
                            <div className="flex items-center justify-between text-xs font-bold text-amber-300">
                                <div className="flex items-center gap-2">
                                    <span>⚡</span> Hermes Tool Call: <span className="font-mono text-white">{tc.name}</span>
                                </div>
                                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-500/20 border border-amber-500/30 text-amber-300">
                                    Nous Format
                                </span>
                            </div>
                            {tc.args && (
                                <pre className="text-xs text-amber-100 font-mono bg-black/40 p-2.5 rounded-lg border border-amber-500/20 overflow-x-auto">
                                    {tc.args}
                                </pre>
                            )}
                        </div>
                    ))}

                    {/* Synthesized Skill Cards */}
                    {createdSkills.map((cs, idx) => (
                        <div key={`cs-${idx}`} className="border border-violet-500/40 bg-violet-950/20 rounded-xl p-3.5 flex flex-col gap-2 shadow-sm">
                            <div className="flex items-center justify-between text-xs font-bold text-violet-300">
                                <div className="flex items-center gap-2">
                                    <span>✨</span> Dynamic Skill Synthesized: <span className="font-mono text-white">{cs.name}</span>
                                </div>
                                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-violet-500/20 border border-violet-500/30 text-violet-300">
                                    Eval Gate Active
                                </span>
                            </div>
                            <div className="text-xs text-slate-300 font-mono bg-black/40 p-2.5 rounded-lg border border-violet-500/20 max-h-40 overflow-y-auto whitespace-pre-wrap">
                                {cs.body}
                            </div>
                        </div>
                    ))}

                    {/* Standard Tool Execution & Unified Diff */}
                    {tools.map((t, idx) => {
                        const isDiff = t.type === 'patch_file' || (t.body && (t.body.includes('@@') || (t.body.includes('---') && t.body.includes('+++'))));
                        if (isDiff) {
                            return <UnifiedDiffViewer key={idx} diffText={t.body} title={t.type.replace('_', ' ')} />;
                        }
                        return (
                            <div key={idx} className="border border-sky-500/30 bg-sky-950/20 rounded-xl p-3.5 flex flex-col gap-2 shadow-sm">
                                <div className="flex items-center gap-2 text-sky-400 text-xs font-bold uppercase tracking-wider">
                                    <span>🛠️</span> {t.type.replace('_', ' ')}
                                </div>
                                <pre className="text-xs text-slate-200 whitespace-pre-wrap max-h-40 overflow-y-auto font-mono bg-black/40 p-2.5 rounded-lg border border-slate-800">{t.body}</pre>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const App = () => {
            const [sessions, setSessions] = useState(() => JSON.parse(localStorage.getItem('swarmV2Sessions') || '[]'));
            const [currentSessionId, setCurrentSessionId] = useState(() => localStorage.getItem('swarmV2SessionId') || Date.now().toString());
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('swarmV2History') || '[]'));
            const [input, setInput] = useState('');
            const [files, setFiles] = useState([]);
            const [isStreaming, setIsStreaming] = useState(false);
            const [abortController, setAbortController] = useState(null);
            const [selectedModel, setSelectedModel] = useState('qwen2.5-coder:latest');
            const [uncensored, setUncensored] = useState(false);
            const [agentStatus, setAgentStatus] = useState('');
            
            // Governance Modal State
            const [showGovernance, setShowGovernance] = useState(false);
            const [govData, setGovData] = useState(null);

            // Skills Toolkit Modal State
            const [showSkillsModal, setShowSkillsModal] = useState(false);
            const [skillsList, setSkillsList] = useState([]);
            const [skillsLoading, setSkillsLoading] = useState(false);
            const [skillCategory, setSkillCategory] = useState('all');
            const [skillSearch, setSkillSearch] = useState('');
            const [selectedSkillPreview, setSelectedSkillPreview] = useState(null);
            const [previewLoading, setPreviewLoading] = useState(false);
            const [copiedToast, setCopiedToast] = useState(false);

            // Workspace Files & Live Preview State
            const [activeSidebarTab, setActiveSidebarTab] = useState('sessions'); // 'sessions' | 'workspace'
            const [workspaceFiles, setWorkspaceFiles] = useState([]);
            const [workspaceLoading, setWorkspaceLoading] = useState(false);
            const [selectedWorkspaceFile, setSelectedWorkspaceFile] = useState(null);
            const [fileContentLoading, setFileContentLoading] = useState(false);
            const [activeFileViewTab, setActiveFileViewTab] = useState('preview'); // 'preview' | 'code'

            const messagesEndRef = useRef(null);

            // Keyboard Escape Handler for Modals
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        setShowSkillsModal(false);
                        setShowGovernance(false);
                        setSelectedSkillPreview(null);
                        setSelectedWorkspaceFile(null);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            // Fetch Workspace Files
            const loadWorkspaceFiles = async () => {
                setWorkspaceLoading(true);
                try {
                    const res = await fetch('/api/workspace/files');
                    const data = await res.json();
                    if (data && data.files) {
                        setWorkspaceFiles(data.files);
                    }
                } catch(e) {
                    console.error("Failed to fetch workspace files:", e);
                } finally {
                    setWorkspaceLoading(false);
                }
            };

            // Open Workspace File Content
            const openWorkspaceFile = async (path) => {
                setFileContentLoading(true);
                try {
                    const res = await fetch(`/api/workspace/file?path=${encodeURIComponent(path)}`);
                    const data = await res.json();
                    setSelectedWorkspaceFile(data);
                    setActiveFileViewTab(data.is_html ? 'preview' : 'code');
                } catch(e) {
                    console.error("Failed to load file:", e);
                } finally {
                    setFileContentLoading(false);
                }
            };

            useEffect(() => {
                loadWorkspaceFiles();
            }, []);

            // Fetch Skills Toolkit
            const loadSkills = async () => {
                setSkillsLoading(true);
                try {
                    const res = await fetch('/api/skills');
                    const data = await res.json();
                    if (data && data.skills) {
                        setSkillsList(data.skills);
                    }
                } catch(e) {
                    console.error("Failed to fetch skills:", e);
                } finally {
                    setSkillsLoading(false);
                }
            };

            const viewSkillDetail = async (slug) => {
                setPreviewLoading(true);
                try {
                    const res = await fetch(`/api/skills/${encodeURIComponent(slug)}`);
                    const data = await res.json();
                    setSelectedSkillPreview(data);
                } catch(e) {
                    console.error("Failed to load skill detail:", e);
                } finally {
                    setPreviewLoading(false);
                }
            };

            const injectSkillIntoPrompt = (slug, isPythonTool) => {
                if (isPythonTool) {
                    setInput(prev => prev + (prev ? '\n' : '') + `<use_skill>\n  <name>${slug}</name>\n  <args>--quick</args>\n</use_skill>`);
                } else {
                    setInput(prev => prev + (prev ? '\n' : '') + `<select_skill>\n  <skill_name>${slug}</skill_name>\n  <reason>Equip swarm with this framework</reason>\n</select_skill>`);
                }
                setShowSkillsModal(false);
            };

            const copySnippetToClipboard = (slug, isPythonTool) => {
                const snippet = isPythonTool 
                    ? `<use_skill>\n  <name>${slug}</name>\n  <args>--quick</args>\n</use_skill>`
                    : `<select_skill>\n  <skill_name>${slug}</skill_name>\n  <reason>Equip swarm with this framework</reason>\n</select_skill>`;
                navigator.clipboard.writeText(snippet);
                setCopiedToast(true);
                setTimeout(() => setCopiedToast(false), 2000);
            };

            // Deduplicate Sessions on Load
            useEffect(() => {
                setSessions(prev => {
                    const unique = [];
                    const seen = new Set();
                    for (const s of prev) {
                        if (!seen.has(s.title)) {
                            seen.add(s.title);
                            unique.push(s);
                        }
                    }
                    return unique;
                });
            }, []);

            // Save History & Sessions to LocalStorage
            useEffect(() => {
                localStorage.setItem('swarmV2History', JSON.stringify(history));
                localStorage.setItem('swarmV2SessionId', currentSessionId);
                localStorage.setItem('swarmV2Sessions', JSON.stringify(sessions));

                if (history.length > 0) {
                    setSessions(prev => {
                        const existing = prev.findIndex(s => s.id === currentSessionId);
                        const title = history.find(h => h.role === 'user')?.content.substring(0, 30) + '...' || 'New Chat';
                        const newSessions = [...prev];
                        if (existing >= 0) {
                            newSessions[existing].title = title;
                            newSessions[existing].history = history;
                        } else {
                            newSessions.unshift({ id: currentSessionId, title, history });
                        }
                        return newSessions;
                    });
                }
            }, [history, currentSessionId]);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [history, isStreaming]);

            const deleteSession = (e, id) => {
                e.stopPropagation();
                setSessions(prev => prev.filter(s => s.id !== id));
                if (currentSessionId === id) {
                    startNewChat();
                }
            };

            const startNewChat = () => {
                setHistory([]);
                const newId = Date.now().toString();
                setCurrentSessionId(newId);
            };

            const loadSession = (session) => {
                setHistory(session.history || []);
                setCurrentSessionId(session.id);
            };

            const handleFileSelect = (e) => {
                const selected = e.target.files;
                for (let i=0; i<selected.length; i++) {
                    const file = selected[i];
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setFiles(prev => [...prev, { name: file.name, type: file.type, content: evt.target.result }]);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const removeFile = (idx) => {
                setFiles(prev => prev.filter((_, i) => i !== idx));
            };

            const handleSubmit = async (e) => {
                if(e) e.preventDefault();
                if ((!input.trim() && files.length === 0) || isStreaming) return;

                const userMsg = input.trim();
                const attached = [...files];
                
                setInput('');
                setFiles([]);

                const newHistory = [...history, { role: 'user', content: userMsg, attached }];
                setHistory(newHistory);
                setIsStreaming(true);

                try {
                    const controller = new AbortController();
                    setAbortController(controller);
                    const res = await fetch('/build', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: userMsg,
                            files: attached,
                            history: newHistory,
                            model: selectedModel,
                            uncensored: uncensored
                        }),
                        signal: controller.signal
                    });

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";

                    setHistory(prev => [...prev, { role: 'assistant', content: '' }]);

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, {stream: true});
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.trim()) continue;
                            try {
                                const chunk = JSON.parse(line);
                                if (chunk.type === 'stream' && chunk.chunk) {
                                    setHistory(prev => {
                                        const h = [...prev];
                                        const lastMsg = { ...h[h.length - 1] };
                                        lastMsg.content += chunk.chunk;
                                        h[h.length - 1] = lastMsg;
                                        return h;
                                    });
                                } else if (chunk.type === 'system' && chunk.msg) {
                                    setAgentStatus(chunk.msg);
                                } else if (chunk.type === 'thought' && chunk.thought) {
                                    setHistory(prev => {
                                        const h = [...prev];
                                        const lastMsg = { ...h[h.length - 1] };
                                        lastMsg.content += `\n\n<think>${chunk.thought}</think>\n\n`;
                                        h[h.length - 1] = lastMsg;
                                        return h;
                                    });
                                } else if (chunk.type === 'finish') {
                                    setAgentStatus('');
                                    setSessions(prev => {
                                        const newSessions = [...prev];
                                        const idx = newSessions.findIndex(s => s.id === currentSessionId);
                                        if (idx !== -1 && chunk.metrics) {
                                            newSessions[idx].metrics = chunk.metrics;
                                        }
                                        return newSessions;
                                    });
                                } else if (chunk.type === 'action') {
                                    setHistory(prev => {
                                        const h = [...prev];
                                        const lastMsg = h[h.length - 1];
                                        lastMsg.content += `\n\n<swarm_action action="${chunk.action}">${chunk.result}</swarm_action>\n\n`;
                                        return h;
                                    });
                                }
                            } catch(err) {}
                        }
                    }
                } catch(err) {
                    if (err.name === 'AbortError') {
                        setHistory(prev => {
                            const h = [...prev];
                            h[h.length - 1].content += "\n\n⚠️ **Generation stopped by user.**";
                            return h;
                        });
                    } else {
                        setHistory(prev => {
                            const h = [...prev];
                            h[h.length - 1].content = "⚠️ Connection error to backend.";
                            return h;
                        });
                    }
                } finally {
                    setIsStreaming(false);
                    setAgentStatus('');
                    setAbortController(null);
                    setHistory(prev => {
                        const h = [...prev];
                        if (h[h.length - 1]) {
                            h[h.length - 1].content = h[h.length - 1].content.trim();
                        }
                        return h;
                    });
                    loadWorkspaceFiles();
                }
            };

            // Category Counts
            const categoryCounts = {
                all: skillsList.length || 92,
                'code-quality': skillsList.filter(s => s.category === 'code-quality').length || 2,
                productivity: skillsList.filter(s => s.category === 'productivity').length || 3,
                'agent-architecture': skillsList.filter(s => s.category === 'agent-architecture').length || 1,
                'swarm-coordination': skillsList.filter(s => s.category === 'swarm-coordination').length || 5,
                interface: skillsList.filter(s => s.category === 'interface').length || 7,
                research: skillsList.filter(s => s.category === 'research').length || 1,
                python_tool: skillsList.filter(s => s.category === 'python_tool' || s.category === 'tool').length || 3,
                'design-theme': skillsList.filter(s => s.category === 'design-theme').length || 70
            };

            // Filtered Skills
            const filteredSkills = skillsList.filter(s => {
                let matchesCat = skillCategory === 'all';
                if (!matchesCat) {
                    if (skillCategory === 'python_tool') {
                        matchesCat = s.category === 'python_tool' || s.category === 'tool';
                    } else {
                        matchesCat = s.category === skillCategory;
                    }
                }
                const matchesQuery = !skillSearch || 
                    s.name.toLowerCase().includes(skillSearch.toLowerCase()) || 
                    s.description.toLowerCase().includes(skillSearch.toLowerCase()) ||
                    s.slug.toLowerCase().includes(skillSearch.toLowerCase());
                return matchesCat && matchesQuery;
            });

            return (
                <div className="flex h-screen bg-slate-950 text-slate-300 font-sans">
                    {/* Left Sidebar */}
                    <div className="w-64 border-r border-slate-800 bg-slate-900 flex flex-col justify-between select-none">
                        <div className="flex flex-col flex-1 overflow-hidden">
                            {/* App Header */}
                            <div className="p-4 border-b border-slate-800 flex items-center justify-between font-bold text-white tracking-wider">
                                <div className="flex items-center gap-2.5">
                                    <span className="text-sky-400 text-lg">⚡</span>
                                    <span className="text-sm font-extrabold tracking-wide">Swarm IDE</span>
                                </div>
                                <button 
                                    onClick={startNewChat}
                                    aria-label="New session"
                                    className="px-2.5 py-1 bg-sky-600/20 hover:bg-sky-600/30 text-sky-400 border border-sky-500/40 rounded-lg text-xs font-semibold transition active:scale-[0.97] focus-visible:ring-2 focus-visible:ring-sky-500 focus-visible:outline-none"
                                >
                                    + New
                                </button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto flex flex-col">
                                {/* Settings */}
                                <div className="p-4">
                                    <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-widest mb-2.5">Model Engine</div>
                                    <div className="mb-3.5">
                                        <select 
                                            value={selectedModel}
                                            onChange={(e) => setSelectedModel(e.target.value)}
                                            aria-label="Model Selection"
                                            className="w-full bg-slate-950 border border-slate-700/80 text-xs rounded-xl px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition"
                                        >
                                            <option value="qwen2.5-coder:latest">Qwen2.5-Coder (7B)</option>
                                            <option value="llama3.1:8b">Llama-3.1 (8B)</option>
                                            <option value="deepseek-r1:7b">DeepSeek-R1 (7B)</option>
                                            <option value="hermes3:8b">Hermes-3 (8B)</option>
                                        </select>
                                    </div>
                                    <label className="flex items-center gap-2 text-xs text-slate-400 cursor-pointer hover:text-white transition select-none">
                                        <input type="checkbox" checked={uncensored} onChange={(e) => setUncensored(e.target.checked)} className="accent-rose-500 rounded" />
                                        Unrestricted Heretic Mode
                                    </label>
                                </div>

                                {/* Skills Toolkit Button */}
                                <div className="px-4">
                                    <button 
                                        onClick={() => { setShowSkillsModal(true); loadSkills(); }}
                                        aria-label="Open Skills Arsenal"
                                        className="w-full py-2.5 bg-gradient-to-r from-purple-950/60 to-sky-950/60 border border-purple-500/40 hover:border-purple-400 text-purple-200 rounded-xl text-xs transition font-semibold shadow-sm flex items-center justify-center gap-2 active:scale-[0.97] focus-visible:ring-2 focus-visible:ring-purple-500 focus-visible:outline-none"
                                    >
                                        <span className="text-sm">⚡</span> Skills Toolkit ({skillsList.length || 85})
                                    </button>
                                </div>

                                {/* Governance Log Button */}
                                <div className="mt-2 px-4">
                                    <button 
                                        onClick={() => setShowGovernance(true)} 
                                        aria-label="Open Governance Logs"
                                        className="w-full py-2 bg-slate-950 border border-slate-800 hover:bg-slate-800 text-slate-300 rounded-xl text-xs transition font-semibold shadow-sm flex items-center justify-center gap-2 active:scale-[0.97] focus-visible:ring-2 focus-visible:ring-sky-500 focus-visible:outline-none"
                                    >
                                        <span>🛡️</span> Governance Log
                                    </button>
                                </div>
                                
                                {/* Sidebar Switcher: Sessions vs Workspace */}
                                <div className="px-4 pb-2 mt-3 flex-1 overflow-hidden flex flex-col">
                                    <div className="flex items-center gap-1 p-1 bg-slate-950 border border-slate-800 rounded-xl mb-3">
                                        <button
                                            onClick={() => setActiveSidebarTab('sessions')}
                                            className={`flex-1 py-1 text-xs rounded-lg font-semibold transition active:scale-[0.97] ${activeSidebarTab === 'sessions' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}
                                        >
                                            💬 Sessions
                                        </button>
                                        <button
                                            onClick={() => { setActiveSidebarTab('workspace'); loadWorkspaceFiles(); }}
                                            className={`flex-1 py-1 text-xs rounded-lg font-semibold transition active:scale-[0.97] flex items-center justify-center gap-1.5 ${activeSidebarTab === 'workspace' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}
                                        >
                                            <span>📁</span> Files
                                            {workspaceFiles.length > 0 && (
                                                <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-sky-500/20 text-sky-300 font-mono">
                                                    {workspaceFiles.length}
                                                </span>
                                            )}
                                        </button>
                                    </div>

                                    {activeSidebarTab === 'sessions' ? (
                                        <div className="flex flex-col gap-1 overflow-y-auto flex-1">
                                            {sessions.length === 0 ? <div className="text-xs text-slate-600 p-2">No recent chats</div> : 
                                                sessions.map(s => (
                                                    <div 
                                                        key={s.id} 
                                                        onClick={() => loadSession(s)}
                                                        className={`group flex items-center justify-between text-xs cursor-pointer py-2 px-2.5 rounded-xl transition ${currentSessionId === s.id ? 'bg-sky-600/20 text-sky-200 border border-sky-500/40' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}
                                                    >
                                                        <div className="flex flex-col min-w-0 w-full">
                                                            <span className="truncate pr-2 font-medium">{s.title}</span>
                                                            {s.metrics && (
                                                                <span className="text-[10px] text-slate-400 tabular-nums truncate mt-0.5">
                                                                    TPS: {s.metrics.peak_tps} | Tokens: {s.metrics.total_tokens}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <button 
                                                            onClick={(e) => deleteSession(e, s.id)}
                                                            aria-label="Delete Session"
                                                            className="text-slate-500 hover:text-rose-400 text-sm px-1.5 rounded transition opacity-0 group-hover:opacity-100"
                                                            title="Delete Session"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ))
                                            }
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-1 overflow-y-auto flex-1">
                                            <div className="flex items-center justify-between pb-1.5 px-1 text-[10px] text-slate-400 uppercase tracking-wider font-bold">
                                                <span>Workspace Artifacts</span>
                                                <button 
                                                    onClick={loadWorkspaceFiles}
                                                    title="Refresh Files" 
                                                    className="hover:text-white text-xs transition active:rotate-180"
                                                >
                                                    🔄
                                                </button>
                                            </div>
                                            {workspaceLoading ? (
                                                <div className="flex justify-center p-6"><div className="loader"></div></div>
                                            ) : workspaceFiles.length === 0 ? (

                                                            </>
                                                        ) : (
                                                            (isStreaming && idx === history.length - 1) ? (
                                                                <div className="flex items-center gap-2.5 text-xs text-sky-400 py-1">
                                                                    <div className="loader shrink-0"></div>
                                                                    <span className="font-mono text-[11px]">{agentStatus || 'Swarm is coordinating...'}</span>
                                                                </div>
                                                            ) : (
                                                                <span className="text-rose-400 italic text-sm">⚠️ Connection dropped. Empty response.</span>
                                                            )
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                            {msg.role === 'user' && (
                                                <div className="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center shrink-0 text-xs text-slate-300">
                                                    👤
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} />
                                </div>
                            )}
                        </div>

                        {/* Input Area */}
                        <div className="p-4 border-t border-slate-800 bg-slate-950/90 backdrop-blur">
                            <div className="max-w-4xl mx-auto flex flex-col gap-2">
                                {/* Attached Files Pills */}
                                {files.length > 0 && (
                                    <div className="flex gap-2 flex-wrap px-1">
                                        {files.map((f, i) => (
                                            <div key={i} className="text-xs bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 flex items-center gap-1.5 text-slate-300">
                                                <span>📄</span> <span className="truncate max-w-xs">{f.name}</span>
                                                <button onClick={() => removeFile(i)} aria-label="Remove attached file" className="text-slate-500 hover:text-rose-400 text-xs ml-1">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* Input Form */}
                                <form onSubmit={handleSubmit} className="relative flex items-center">
                                    <textarea 
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); } }}
                                        placeholder="Command your Swarm... (Press Enter to send, Shift+Enter for newline)"
                                        aria-label="Swarm command input"
                                        className="w-full bg-slate-900 border border-slate-700/80 rounded-2xl pl-4 pr-24 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent resize-none overflow-y-auto max-h-32 shadow-inner transition placeholder-slate-500 text-slate-100"
                                        rows="2"
                                    />
                                    <div className="absolute right-3 bottom-3 flex items-center gap-1.5">
                                        <label className="cursor-pointer p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition active:scale-[0.97]" title="Attach File" aria-label="Attach File">
                                            <input type="file" multiple onChange={handleFileSelect} className="hidden" />
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                        </label>
                                        {isStreaming ? (
                                            <button 
                                                type="button" 
                                                onClick={() => abortController && abortController.abort()}
                                                className="px-3 py-1.5 bg-rose-600 text-white rounded-xl hover:bg-rose-500 transition shadow flex items-center justify-center gap-1 text-xs font-bold active:scale-[0.97]"
                                                title="Stop Generation"
                                                aria-label="Stop Generation"
                                            >
                                                ■ Stop
                                            </button>
                                        ) : (
                                            <button 
                                                type="submit" 
                                                disabled={!input.trim() && files.length === 0}
                                                className="p-2 bg-sky-600 text-white rounded-xl hover:bg-sky-500 disabled:opacity-40 disabled:cursor-not-allowed transition shadow active:scale-[0.97]"
                                                title="Send Command"
                                                aria-label="Send Command"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                            </button>
                                        )}
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>
</html>
